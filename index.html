<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YeStyle</title>
    <meta name="description" content="YeStyle 私人 AI 穿搭助手" />
    <meta name="theme-color" content="#E7E8E4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="YeStyle" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="phone-frame">
        <div class="status-bar">
          <span>9:41</span>
          <div class="status-icons">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div id="app" class="app-view"></div>
        <nav class="tabbar" aria-label="主导航">
          <button class="tab-btn active" data-tab="home" aria-label="首页">
            <span class="tab-icon">⌂</span>
            <span>首页</span>
          </button>
          <button class="tab-btn" data-tab="workshop" aria-label="博主工坊">
            <span class="tab-icon">◇</span>
            <span>工坊</span>
          </button>
          <button class="tab-btn" data-tab="wardrobe" aria-label="我的衣橱">
            <span class="tab-icon">▦</span>
            <span>衣橱</span>
          </button>
          <button class="tab-btn" data-tab="detail" aria-label="穿搭详情">
            <span class="tab-icon">✦</span>
            <span>详情</span>
          </button>
        </nav>
      </section>
    </main>

    <div id="iosSheet" class="sheet-mask" aria-hidden="true">
      <div class="ios-sheet" role="dialog" aria-modal="true" aria-label="添加单品">
        <div class="sheet-handle"></div>
        <p class="sheet-title">添加衣橱单品</p>
        <button class="sheet-item" data-action="upload">
          <span>📷</span>
          <div>
            <strong>上传图片</strong>
            <small>从相机、相册或文件中选择</small>
          </div>
        </button>
        <button id="closeSheet" class="sheet-cancel">取消</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
